<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Hermes owns the agent loop. Agy owns Google access.</title>
  <desc id="desc">A separate installer lane invokes Hermes Git installation of the Python provider. On the host, Hermes calls an OpenAI-shaped client which launches the official agy subprocess; agy contacts Google using its own credentials. SOUL and system instructions become GEMINI.md rules. Native tool events pass through a translator to offered Hermes tools and Hermes approvals. An optional read-only conversation database reader delivers reasoning through a fenced lease to the Hermes TUI. The private HOME isolates state, not credentials or OS permissions.</desc>
  <!-- Palette discovery: no sibling SVG or theme tokens found in this repository.
       Accent #7B3FE4 comes from README.md's Hermes plugin catalog badge.
       Remaining colors are neutral canvas/ink/border roles, not product tokens.
       View: local runtime and external credential/network responsibility.
       Evidence for every relationship is linked in architecture.md.
       ROUTING CONTRACT: runtime gutters x=284..336, 576..656, 896..976;
       rules input y=240 then x=616/696; response return y=488;
       tool event x=848; tool handoff y=608; optional reasoning y=856.
       No edge traverses a node interior; labels occupy adjacent empty bands. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7B3FE4"/></marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#666666"/></marker>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #202020; }
    .canvas { fill: #FFFFFF; }
    .zone { fill: #FAFAFA; stroke: #D4D4D4; stroke-width: 1; }
    .external { fill: #FFFFFF; stroke: #A3A3A3; stroke-width: 1; stroke-dasharray: 6 5; }
    .node { fill: #FFFFFF; stroke: #929292; stroke-width: 1.25; }
    .focus { fill: #FFFFFF; stroke: #7B3FE4; stroke-width: 2; }
    .headline { font: 700 26px Inter, ui-sans-serif, sans-serif; }
    .group { font: 600 17px Inter, ui-sans-serif, sans-serif; }
    .label { font: 600 15px Inter, ui-sans-serif, sans-serif; }
    .body { font: 400 13px Inter, ui-sans-serif, sans-serif; fill: #525252; }
    .accent { fill: #7B3FE4; }
    .edge { fill: none; stroke: #7B3FE4; stroke-width: 2; marker-end: url(#arrow); }
    .support { fill: none; stroke: #666666; stroke-width: 1.25; marker-end: url(#arrow-neutral); }
    .optional { fill: none; stroke: #666666; stroke-width: 1.25; stroke-dasharray: 5 4; marker-end: url(#arrow-neutral); }
  </style>
  <rect width="1200" height="960" class="canvas"/>
  <text x="40" y="56" class="headline">Hermes owns the loop. Agy owns Google access.</text>
  <text x="40" y="84" class="body">Local runtime · processes share host-user permissions</text>

  <g id="installation" aria-label="One-time installation, separate from inference">
    <rect x="40" y="112" width="1136" height="88" rx="8" class="zone"/>
    <rect x="64" y="128" width="280" height="56" rx="6" class="node"/>
    <text x="80" y="151" class="label">npm / GitHub Packages installer</text>
    <text x="80" y="171" class="body">Node CLI · one-time setup</text>
    <path d="M344 156 H456" class="support"/>
    <text x="368" y="145" class="body">invokes</text>
    <text x="480" y="151" class="label">Hermes Git install → Python provider plugin</text>
    <text x="480" y="174" class="body">Registry package ships the installer, not the inference runtime.</text>
  </g>

  <g id="instruction-input" aria-label="SOUL and system instructions become agy workspace rules">
    <rect x="64" y="216" width="512" height="56" rx="6" class="node"/>
    <text x="80" y="239" class="label">SOUL.md + Hermes system instructions</text>
    <text x="80" y="259" class="body">Client writes workspace GEMINI.md; inline fallback available.</text>
  </g>
  <g id="credential-input" aria-label="Credentials remain owned by agy">
    <rect x="656" y="216" width="240" height="64" rx="6" class="node"/>
    <text x="672" y="241" class="label">Agy-owned credentials</text>
    <text x="672" y="263" class="body">OS store / encrypted token file</text>
  </g>

  <rect x="40" y="296" width="880" height="456" rx="8" class="zone"/>
  <text x="64" y="324" class="group">Your machine</text>
  <rect x="952" y="296" width="224" height="456" rx="8" class="external"/>
  <text x="976" y="324" class="group">External service</text>

  <g id="connections" aria-label="Model path, response path and tool handoff">
    <path d="M284 404 H336" class="edge"/>
    <path d="M576 404 H656" class="edge"/>
    <path d="M896 404 H976" class="edge"/>
    <text x="296" y="391" class="body">call</text>
    <text x="588" y="391" class="body">spawn</text>
    <text x="911" y="391" class="body">model</text>
    <path d="M576 240 H616 V288 H696 V352" class="support"/>
    <path d="M776 280 V352" class="support"/>
    <path d="M760 456 V488 H456 V456" class="edge"/>
    <text x="396" y="513" class="body">stream-json → OpenAI-shaped response</text>
    <path d="M848 456 V560" class="edge"/>
    <text x="857" y="540" class="body">tool step</text>
    <path d="M656 608 H576" class="edge"/>
    <text x="588" y="592" class="body">handoff</text>
  </g>

  <g id="hermes-agent" aria-label="Hermes agent runtime">
    <rect x="64" y="352" width="220" height="104" rx="8" class="node"/>
    <text x="80" y="383" class="label">Hermes Agent</text>
    <text x="80" y="409" class="body">Agent loop + offered tools</text>
    <text x="80" y="433" class="body">Selects provider and model</text>
  </g>
  <g id="provider-client" aria-label="Python provider and OpenAI-shaped client">
    <rect x="336" y="352" width="240" height="104" rx="8" class="focus"/>
    <text x="352" y="383" class="label accent">Python provider + client</text>
    <text x="352" y="409" class="body">chat.completions.create</text>
    <text x="352" y="433" class="body">Local adapter, not HTTP proxy</text>
  </g>
  <g id="official-agy" aria-label="Official agy subprocess">
    <rect x="656" y="352" width="240" height="104" rx="8" class="focus"/>
    <text x="672" y="383" class="label accent">Official agy subprocess</text>
    <text x="672" y="409" class="body">Google sign-in + model access</text>
    <text x="672" y="433" class="body">Private HOME / workspace state</text>
  </g>
  <g id="google-service" aria-label="Google Antigravity service">
    <rect x="976" y="352" width="176" height="104" rx="8" class="node"/>
    <text x="992" y="383" class="label">Google</text>
    <text x="992" y="409" class="body">Antigravity plan</text>
    <text x="992" y="433" class="body">Model inference</text>
    <text x="976" y="496" class="body">Agy handles network</text>
    <text x="976" y="516" class="body">and account session.</text>
  </g>
  <g id="tool-translator" aria-label="Known native tool names map to offered Hermes tools">
    <rect x="656" y="560" width="240" height="96" rx="8" class="node"/>
    <text x="672" y="589" class="label">Native-tool translator</text>
    <text x="672" y="614" class="body">Known name + offered tool</text>
    <text x="672" y="637" class="body">Close agy; reject unmapped</text>
  </g>
  <g id="hermes-tool-execution" aria-label="Hermes executes forwarded calls under its approvals">
    <rect x="64" y="560" width="512" height="96" rx="8" class="node"/>
    <text x="80" y="589" class="label">Hermes tool execution + approval policy</text>
    <text x="80" y="614" class="body">Forward mapped calls; Hermes decides approval and execution.</text>
    <text x="80" y="637" class="body">Example: run_command → terminal</text>
  </g>
  <g id="security-boundary-note" aria-label="State isolation does not isolate credentials or OS access">
    <text x="64" y="696" class="label">State isolation only. No credential or OS sandbox.</text>
    <text x="64" y="720" class="body">Token: symlink → hardlink → copy. macOS: shared Keychains.</text>
    <text x="976" y="696" class="body">Tool coverage is limited.</text>
    <text x="976" y="720" class="body">See architecture.md.</text>
  </g>

  <g id="optional-reasoning" aria-label="Optional read-only reasoning delivery">
    <text x="40" y="792" class="group">Optional reasoning presentation</text>
    <rect x="64" y="824" width="240" height="64" rx="8" class="node"/>
    <text x="80" y="850" class="label">Agy conversation DB</text>
    <text x="80" y="873" class="body">Fallback for missing thinking</text>
    <path d="M304 856 H376" class="optional"/>
    <rect x="376" y="824" width="456" height="64" rx="8" class="node"/>
    <text x="392" y="850" class="label">Read-only thinking reader → fenced lease</text>
    <text x="392" y="873" class="body">Request / session identity + callback / client liveness</text>
    <path d="M832 856 H904" class="optional"/>
    <rect x="904" y="824" width="248" height="64" rx="8" class="node"/>
    <text x="920" y="850" class="label">Hermes TUI callback</text>
    <text x="920" y="873" class="body">Existing show / hide controls</text>
  </g>
  <text x="40" y="928" class="body">Solid: runtime / inputs. Dashed: optional / external boundary.</text>
  <text x="1152" y="928" text-anchor="end" class="body">Source links: architecture.md</text>
</svg>
